name: OSSF Scorecard

# Scorecard assesses supply-chain security posture (branch protection, pinned
# actions, SAST, code reviews, etc.) and publishes the results publicly to
# https://securityscorecards.dev so users can evaluate the project's practices.
#
# Runs on every push to main (so the public score stays current) and weekly
# for scheduled re-evaluation against newly published checks.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * 1'  # Weekly on Monday at 1:30 AM
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Top-level permission must be read-only; write permissions are declared at
# the job level so Scorecard's API validation passes (it rejects workflows
# where any top-level permission is set to "write").
permissions:
  contents: read

jobs:
  analyze:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions are accepted by the Scorecard API.
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishes results to https://securityscorecards.dev (public repo only).
          publish_results: true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard

      - name: Upload results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 7
